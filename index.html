<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nineteen Forever | Official Site</title>

  <style>
    /* ===== Base Layout ===== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: radial-gradient(circle at top, #101122 0, #020308 55%, #000 100%);
      color: #f7f7ff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page {
      width: 100%;
      max-width: 960px;
      padding: 2.5rem 1.5rem 1.75rem;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      min-height: 100vh;
    }

    .hero {
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }

    /* ===== Neon Logo Wrapper ===== */

    .logo-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 1.75rem 2.5rem;
      border-radius: 999px;
      position: relative;
      cursor: pointer;
      border: 3px solid rgba(0, 255, 255, 0.9);
      box-shadow:
        0 0 8px rgba(0, 255, 255, 0.9),
        0 0 22px rgba(0, 180, 255, 0.9),
        0 0 48px rgba(0, 120, 255, 0.7);
      animation: neon-flicker 2.2s linear both;
    }

    .logo-wrapper::before {
      content: "";
      position: absolute;
      inset: -16px;
      border-radius: inherit;
      border: 2px solid rgba(255, 0, 150, 0.28);
      filter: blur(2px);
      opacity: 0.9;
      pointer-events: none;
    }

    /* Logo image */
    .logo-img {
      width: clamp(260px, 55vw, 420px);
      height: auto;
      display: block;
      transition: filter 0.25s ease-out, transform 0.25s ease-out;
      animation: neon-flicker 2.2s linear both;
      animation-delay: 0.05s;
    }

    /* Hover color-shift effect (tint) */
    .logo-wrapper:hover .logo-img {
      filter:
        drop-shadow(0 0 6px #40f5ff)
        drop-shadow(0 0 14px #40f5ff)
        drop-shadow(0 0 26px #00c8ff)
        hue-rotate(45deg);
      transform: scale(1.04);
    }

    .tagline {
      font-size: clamp(1rem, 2.4vw, 1.15rem);
      opacity: 0.9;
      max-width: 32rem;
    }

    .meta {
      font-size: 0.9rem;
      opacity: 0.7;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ===== Socials Footer ===== */

    footer {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.9rem;
      padding-bottom: 0.5rem;
    }

    .socials {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .social-link {
      text-decoration: none;
      position: relative;
    }

    .social-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid rgba(0, 255, 180, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 600;
      text-transform: uppercase;
      color: #00ffd0;
      box-shadow:
        0 0 4px #00ffd0,
        0 0 12px rgba(0, 255, 208, 0.85),
        0 0 22px rgba(0, 180, 255, 0.7);
      text-shadow:
        0 0 4px #00ffd0,
        0 0 10px rgba(0, 255, 208, 0.9);
      transition:
        transform 0.18s ease-out,
        box-shadow 0.18s ease-out,
        color 0.18s ease-out,
        border-color 0.18s ease-out;
      animation: neon-flicker 2.2s linear both;
      animation-delay: 0.25s;
    }

    .social-link:hover .social-icon {
      transform: translateY(-2px) scale(1.05);
      border-color: #ffde59;
      color: #ffde59;
      box-shadow:
        0 0 6px #ffde59,
        0 0 16px #ffde59,
        0 0 30px rgba(255, 170, 50, 0.95);
    }

    .credits {
      font-size: 0.75rem;
      opacity: 0.45;
    }

    /* Flicker animation */
    @keyframes neon-flicker {
      0% { opacity: 0; filter: brightness(0.4); }
      5% { opacity: 1; }
      12% { opacity: 0.2; }
      18% { opacity: 1; }
      26% { opacity: 0.1; }
      32% { opacity: 1; }
      45% { opacity: 0.4; }
      55% { opacity: 1; filter: brightness(0.9); }
      72% { opacity: 0.7; }
      100% { opacity: 1; filter: brightness(1); }
    }

    @media (max-width: 600px) {
      .page {
        padding-inline: 1.2rem;
        gap: 1.75rem;
      }

      .social-icon {
        width: 40px;
        height: 40px;
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <main class="hero">
      <p class="meta">Indie / Alternative · 4-Piece Cover Band</p>

      <!-- LOGO IMAGE (same folder as index.html) -->
      <div class="logo-wrapper">
        <img src="neon-logo.png" alt="Nineteen Forever Neon Logo" class="logo-img" />
      </div>

      <p class="tagline">
        Neon-lit indie anthems for the late-night crowd. Pubs, parties & all-night sing-alongs.
      </p>
    </main>

    <footer>
      <div class="socials">
        <a class="social-link" href="https://facebook.com/yourband" target="_blank" rel="noopener noreferrer">
          <div class="social-icon">f</div>
        </a>
        <a class="social-link" href="https://instagram.com/yourband" target="_blank" rel="noopener noreferrer">
          <div class="social-icon">ig</div>
        </a>
