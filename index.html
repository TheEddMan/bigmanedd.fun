<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gulag Fight Simulator</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    body {
      margin: 0;
      font-family: 'Press Start 2P', monospace;
      background-color: black;
      color: #39ff14;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .scanlines::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0px,
        rgba(0, 0, 0, 0.15) 2px,
        rgba(0, 0, 0, 0) 4px
      );
      z-index: 2;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
    }

    input {
      background-color: black;
      border: 2px solid #39ff14;
      color: #39ff14;
      padding: 10px;
      margin: 5px;
      width: 80%;
      font-family: 'Press Start 2P', monospace;
    }

    button {
      background-color: #39ff14;
      color: black;
      padding: 10px 20px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Press Start 2P', monospace;
      margin-top: 10px;
    }

    #countdown, #fight-log, #confetti, #winner {
      display: none;
    }

    .line {
      opacity: 0.4;
      font-size: 2rem;
      margin-top: 20px;
      transition: opacity 0.5s;
    }

    .line.newest {
      opacity: 1;
      color: #39ff14;
      font-weight: bold;
      font-size: 2.8rem;
      animation: shake 0.4s;
    }

    @keyframes shake {
      0% { transform: translate(0px, 0px); }
      20% { transform: translate(-6px, 6px); }
      40% { transform: translate(6px, -6px); }
      60% { transform: translate(-6px, 6px); }
      80% { transform: translate(6px, -6px); }
      100% { transform: translate(0px, 0px); }
    }

    #confetti {
      font-size: 1.2rem;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 5px;
      padding: 20px;
      animation: explode 0.6s ease-in-out;
      flex-direction: row;
    }

    .confetti-piece {
      color: #ff69b4;
      font-size: 2rem;
      animation: burst 0.8s ease-in-out infinite;
    }

    @keyframes burst {
      0% { transform: scale(0.5) rotate(0deg); opacity: 0; }
      50% { transform: scale(1.8) rotate(180deg); opacity: 1; }
      100% { transform: scale(1) rotate(360deg); opacity: 0; }
    }

    #winner {
      font-size: 2rem;
      margin-top: 40px;
      color: #ff69b4;
      animation: explode 0.6s ease-in-out;
    }

    @keyframes explode {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="scanlines">
  <div class="container" id="title-screen">
    <h1>GULAG FIGHT SIMULATOR</h1>
    <input type="text" id="fighter1" placeholder="Enter Fighter 1 Name" />
    <input type="text" id="fighter2" placeholder="Enter Fighter 2 Name" />
    <br />
    <button onclick="startGame()">Enter the Gulag</button>
  </div>

  <div class="container" id="countdown">
    <h1 id="count">3</h1>
  </div>

  <div class="container" id="fight-log"></div>
  <div class="container" id="winner"></div>
  <div class="container" id="confetti"></div>

  <script>
    const countdownEl = document.getElementById("count");
    const countdownScreen = document.getElementById("countdown");
    const titleScreen = document.getElementById("title-screen");
    const fightLog = document.getElementById("fight-log");
    const confetti = document.getElementById("confetti");
    const winnerDiv = document.getElementById("winner");

    let lines = [
      "{ATTACKER} rips out {DEFENDER}'s teeth with a rusted wrench!",
      "{ATTACKER} smashes {DEFENDER}'s kneecaps like glass marbles!",
      "{ATTACKER} drives a nail through {DEFENDER}'s hand with a brick!",
      "{ATTACKER} shoves {DEFENDER} face-first into a broken pipe!",
      "{ATTACKER} ends it by choking {DEFENDER} out with torn wire!"
    ];

    function startGame() {
      const name1 = document.getElementById("fighter1").value || "Fighter 1";
      const name2 = document.getElementById("fighter2").value || "Fighter 2";

      titleScreen.style.display = "none";
      countdownScreen.style.display = "block";

      let count = 3;
      const interval = setInterval(() => {
        if (count > 0) {
          countdownEl.textContent = count;
          count--;
        } else {
          clearInterval(interval);
          countdownEl.textContent = "FIGHT!";
          setTimeout(() => {
            countdownScreen.style.display = "none";
            startFight(name1, name2);
          }, 1000);
        }
      }, 1000);
    }

    function startFight(name1, name2) {
      fightLog.style.display = "block";
      let index = 0;

      const fightInterval = setInterval(() => {
        if (index < lines.length) {
          const attacker = Math.random() > 0.5 ? name1 : name2;
          const defender = attacker === name1 ? name2 : name1;

          const line = lines[index]
            .replace("{ATTACKER}", attacker)
            .replace("{DEFENDER}", defender);

          const div = document.createElement("div");
          div.className = "line newest";
          div.textContent = line;

          const previous = fightLog.querySelector(".newest");
          if (previous) previous.classList.remove("newest");

          fightLog.appendChild(div);
          if (fightLog.children.length > 5) {
            fightLog.removeChild(fightLog.children[0]);
          }

          index++;
        } else {
          clearInterval(fightInterval);
          declareWinner(name1, name2);
        }
      }, 2000);
    }

    function declareWinner(name1, name2) {
      const winner = Math.random() > 0.5 ? name1 : name2;
      winnerDiv.style.display = "block";
      winnerDiv.textContent = `AND THE WINNER IS ${winner}!`;
      confetti.style.display = "flex";
      confetti.innerHTML = '';

      for (let i = 0; i < 100; i++) {
        const span = document.createElement('span');
        span.className = 'confetti-piece';
        span.textContent = winner;
        confetti.appendChild(span);
      }
    }
  </script>
</body>
</html>
