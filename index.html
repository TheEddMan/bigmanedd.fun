<script>
  (function () {
    const STORAGE_KEY = "rss_board_feeds_v1";
    const USE_CORS_PROXY = true; // Toggle this if you ever host your own proxy

    const feedForm = document.getElementById("feed-form");
    const feedNameInput = document.getElementById("feed-name");
    const feedUrlInput = document.getElementById("feed-url");
    const feedsListEl = document.getElementById("feeds-list");
    const feedsEmptyEl = document.getElementById("feeds-empty");
    const articlesListEl = document.getElementById("articles-list");
    const articlesEmptyEl = document.getElementById("articles-empty");
    const errorEl = document.getElementById("error");
    const statusPill = document.getElementById("status-pill");
    const statusDetail = document.getElementById("status-detail");
    const currentFeedNameEl = document.getElementById("current-feed-name");
    const currentFeedUrlEl = document.getElementById("current-feed-url");
    const addDemoBtn = document.getElementById("add-demo-feeds");
    const clearFeedsBtn = document.getElementById("clear-feeds");

    /** @type {{id:string,name:string,url:string}[]} */
    let feeds = [];
    let activeFeedId = null;

    function loadFeeds() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) {
          feeds = parsed;
        }
      } catch (e) {
        console.warn("Could not load feeds from storage", e);
      }
    }

    function saveFeeds() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(feeds));
      } catch (e) {
        console.warn("Could not save feeds to storage", e);
      }
    }

    function renderFeeds() {
      feedsListEl.innerHTML = "";

      if (feeds.length === 0) {
        feedsEmptyEl.style.display = "block";
      } else {
        feedsEmptyEl.style.display = "none";
      }

      feeds.forEach((feed) => {
        const item = document.createElement("div");
        item.className = "feed-item";
        if (feed.id === activeFeedId) {
          item.classList.add("active");
        }

        const main = document.createElement("div");
        main.className = "feed-item-main";

        const title = document.createElement("div");
        title.className = "feed-item-title";
        title.textContent = feed.name || "Untitled feed";

        const url = document.createElement("div");
        url.className = "feed-item-url";
        url.textContent = feed.url;

        main.appendChild(title);
        main.appendChild(url);

        const actions = document.createElement("div");
        actions.className = "feed-item-actions";

        const chip = document.createElement("span");
        chip.className = "chip";
        chip.innerHTML = '<span class="chip-dot"></span>Live';

        const removeBtn = document.createElement("button");
        removeBtn.className = "btn-icon";
        removeBtn.type = "button";
        removeBtn.textContent = "Remove";

        removeBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          removeFeed(feed.id);
        });

        actions.appendChild(chip);
        actions.appendChild(removeBtn);

        item.appendChild(main);
        item.appendChild(actions);

        item.addEventListener("click", () => {
          if (activeFeedId === feed.id) {
            // toggle off
            activeFeedId = null;
            currentFeedNameEl.textContent = "No feed selected";
            currentFeedUrlEl.textContent = "";
            articlesListEl.innerHTML = "";
            articlesEmptyEl.style.display = "block";
            setStatus("Idle", "Select a feed");
            errorEl.style.display = "none";
          } else {
            activeFeedId = feed.id;
            currentFeedNameEl.textContent = feed.name || "Untitled feed";
            currentFeedUrlEl.textContent = feed.url;
            fetchAndRenderFeed(feed.url);
          }
          renderFeeds();
        });

        feedsListEl.appendChild(item);
      });
    }

    function setStatus(label, detail) {
      statusPill.querySelector("span").textContent = label;
      statusDetail.textContent = detail;
    }

    function showError(message) {
      errorEl.textContent = "";
      const strong = document.createElement("strong");
      strong.textContent = "Error";
      errorEl.appendChild(strong);
      errorEl.appendChild(document.createTextNode(" " + message));
      errorEl.style.display = "block";
    }

    function clearError() {
      errorEl.style.display = "none";
      errorEl.textContent = "";
    }

    function removeFeed(id) {
      const idx = feeds.findIndex((f) => f.id === id);
      if (idx === -1) return;
      feeds.splice(idx, 1);
      if (activeFeedId === id) {
        activeFeedId = null;
        currentFeedNameEl.textContent = "No feed selected";
        currentFeedUrlEl.textContent = "";
        articlesListEl.innerHTML = "";
        articlesEmptyEl.style.display = "block";
        setStatus("Idle", "Select a feed");
        clearError();
      }
      saveFeeds();
      renderFeeds();
    }

    function shortText(text, maxLen) {
      if (!text) return "";
      const trimmed = text.replace(/\s+/g, " ").trim();
      if (trimmed.length <= maxLen) return trimmed;
      return trimmed.slice(0, maxLen - 1) + "…";
    }

    function tryParseDate(dateStr) {
      if (!dateStr) return null;
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return null;
      return d.toLocaleString(undefined, {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    // 🛠️ MAIN CHANGE: use CORS proxy
    async function fetchAndRenderFeed(url) {
      clearError();
      setStatus("Loading", "Fetching feed…");
      articlesListEl.innerHTML = "";
      articlesEmptyEl.style.display = "none";

      let xmlText;
      try {
        const targetUrl = USE_CORS_PROXY
          ? "https://api.allorigins.win/raw?url=" + encodeURIComponent(url)
          : url;

        const res = await fetch(targetUrl);
        if (!res.ok) {
          throw new Error("HTTP " + res.status);
        }
        xmlText = await res.text();
      } catch (err) {
        console.error("Fetch error", err);
        showError(
          "Could not fetch feed. The feed or the public CORS proxy may be unavailable."
        );
        setStatus("Failed", "Fetch error");
        articlesEmptyEl.style.display = "block";
        return;
      }

      let doc;
      try {
        const parser = new DOMParser();
        doc = parser.parseFromString(xmlText, "application/xml");

        const parserError = doc.querySelector("parsererror");
        if (parserError) {
          throw new Error("Invalid XML");
        }
      } catch (err) {
        console.error("Parse error", err);
        showError("Could not parse RSS/Atom XML for this feed.");
        setStatus("Failed", "Parse error");
        articlesEmptyEl.style.display = "block";
        return;
      }

      /** @type {{title:string,link:string,description:string,date:string|null}[]} */
      const items = [];

      // RSS style: <channel><item>…
      const rssItems = Array.from(doc.querySelectorAll("channel > item"));
      if (rssItems.length > 0) {
        rssItems.forEach((item) => {
          const title = item.querySelector("title")?.textContent || "Untitled";
          const link = item.querySelector("link")?.textContent || "";
          const description =
            item.querySelector("description")?.textContent ||
            item.querySelector("content\\:encoded")?.textContent ||
            "";
          const dateStr =
            item.querySelector("pubDate")?.textContent ||
            item.querySelector("dc\\:date")?.textContent ||
            "";
          items.push({
            title: title.trim(),
            link: link.trim(),
            description: description.trim(),
            date: tryParseDate(dateStr),
          });
        });
      } else {
        // Atom style: <feed><entry>…
        const atomEntries = Array.from(doc.querySelectorAll("feed > entry"));
        atomEntries.forEach((entry) => {
          const title =
            entry.querySelector("title")?.textContent || "Untitled";
          const linkEl =
            entry.querySelector('link[rel="alternate"]') ||
            entry.querySelector("link");
          const link = linkEl?.getAttribute("href") || "";
          const description =
            entry.querySelector("summary")?.textContent ||
            entry.querySelector("content")?.textContent ||
            "";
          const dateStr =
            entry.querySelector("updated")?.textContent ||
            entry.querySelector("published")?.textContent ||
            "";
          items.push({
            title: title.trim(),
            link: link.trim(),
            description: description.trim(),
            date: tryParseDate(dateStr),
          });
        });
      }

      if (items.length === 0) {
        articlesEmptyEl.style.display = "block";
        articlesEmptyEl.textContent =
          "No items found in this feed. It might be an unsupported format.";
        setStatus("Empty", "0 items");
        return;
      }

      // Sort by date (if present)
      items.sort((a, b) => {
        if (!a.date && !b.date) return 0;
        if (!a.date) return 1;
        if (!b.date) return -1;
        return new Date(b.date) - new Date(a.date);
      });

      articlesListEl.innerHTML = "";
      items.slice(0, 30).forEach((item) => {
        const card = document.createElement("article");
        card.className = "article-card";

        const titleRow = document.createElement("div");
        titleRow.className = "article-title-row";

        const title = document.createElement("h3");
        title.textContent = item.title || "Untitled";

        titleRow.appendChild(title);

        const meta = document.createElement("div");
        meta.className = "article-meta";

        if (item.date) {
          const dateSpan = document.createElement("span");
          dateSpan.textContent = item.date;
          meta.appendChild(dateSpan);
        }

        const desc = document.createElement("div");
        desc.className = "article-desc";
        desc.textContent = shortText(item.description, 260);

        const link = document.createElement("div");
        link.className = "article-link";

        if (item.link) {
          const a = document.createElement("a");
          a.href = item.link;
          a.textContent = "Open original";
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          link.appendChild(a);
        } else {
          link.textContent = "No link available.";
        }

        card.appendChild(titleRow);
        if (meta.childNodes.length > 0) {
          card.appendChild(meta);
        }
        if (item.description) {
          card.appendChild(desc);
        }
        card.appendChild(link);

        articlesListEl.appendChild(card);
      });

      articlesEmptyEl.style.display = "none";
      setStatus("Loaded", items.length + " items");
    }

    function addFeed(name, url) {
      const trimmedUrl = (url || "").trim();
      if (!trimmedUrl) return;
      const existing = feeds.find(
        (f) => f.url.toLowerCase() === trimmedUrl.toLowerCase()
      );
      if (existing) {
        activeFeedId = existing.id;
        currentFeedNameEl.textContent = existing.name || "Untitled feed";
        currentFeedUrlEl.textContent = existing.url;
        fetchAndRenderFeed(existing.url);
        renderFeeds();
        return;
      }
      const id =
        "feed_" + Date.now() + "_" + Math.random().toString(16).slice(2);
      const feed = {
        id,
        name: (name || "").trim(),
        url: trimmedUrl,
      };
      feeds.unshift(feed);
      saveFeeds();
      activeFeedId = id;
      currentFeedNameEl.textContent = feed.name || "Untitled feed";
      currentFeedUrlEl.textContent = feed.url;
      renderFeeds();
      fetchAndRenderFeed(feed.url);
    }

    function loadDemoFeeds() {
      const demoFeeds = [
        {
          name: "Hacker News — Front Page",
          url: "https://hnrss.org/frontpage",
        },
        {
          name: "BBC News — World",
          url: "https://feeds.bbci.co.uk/news/world/rss.xml",
        },
      ];
      demoFeeds.forEach((demo) => addFeed(demo.name, demo.url));
    }

    // Event listeners
    feedForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const name = feedNameInput.value;
      const url = feedUrlInput.value;
      if (!url) return;
      addFeed(name, url);
      feedUrlInput.value = "";
      feedNameInput.value = "";
      feedUrlInput.focus();
    });

    addDemoBtn.addEventListener("click", () => {
      loadDemoFeeds();
    });

    clearFeedsBtn.addEventListener("click", () => {
      if (!confirm("Clear all saved feeds?")) return;
      feeds = [];
      activeFeedId = null;
      saveFeeds();
      renderFeeds();
      currentFeedNameEl.textContent = "No feed selected";
      currentFeedUrlEl.textContent = "";
      articlesListEl.innerHTML = "";
      articlesEmptyEl.style.display = "block";
      setStatus("Idle", "Select a feed");
      clearError();
    });

    // Init
    loadFeeds();
    renderFeeds();
    if (feeds.length > 0) {
      const first = feeds[0];
      activeFeedId = first.id;
      currentFeedNameEl.textContent = first.name || "Untitled feed";
      currentFeedUrlEl.textContent = first.url;
      renderFeeds();
      fetchAndRenderFeed(first.url);
    }
  })();
</script>
