<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gulag Terminal Fight</title>
  <style>
    body {
      background-color: #000;
      color: #0f0;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      transition: background-color 0.3s;
    }

    #inputs, #fight-log, #ready, #winner {
      text-align: center;
      width: 80%;
      max-width: 800px;
    }

    input, button {
      margin: 5px;
      padding: 10px;
      font-size: 1rem;
      font-family: monospace;
      background-color: #000;
      color: #0f0;
      border: 1px solid #0f0;
    }

    #fight-log {
      font-size: 1.5rem;
      line-height: 2.2rem;
      margin-top: 20px;
    }

    .line {
      opacity: 0;
      transition: opacity 1s, font-size 1s, transform 1s;
      font-size: 1.5rem;
    }

    .line.visible {
      opacity: 1;
      font-size: 2rem;
      transform: scale(1.1);
      animation: flicker 0.2s infinite alternate;
    }

    .line.faded {
      opacity: 0.2;
      font-size: 1.2rem;
      transform: scale(1);
    }

    #ready {
      font-size: 2rem;
      margin-top: 30px;
      animation: flicker 1s infinite alternate;
    }

    #winner {
      font-size: 2.5rem;
      margin-top: 30px;
      text-shadow: 0 0 10px #0f0;
      position: relative;
    }

    /* Retro CRT flicker effect */
    @keyframes flicker {
      0% { opacity: 0.9; }
      100% { opacity: 1; }
    }

    /* Confetti effect */
    .confetti {
      position: absolute;
      font-size: 1rem;
      animation: fall linear infinite;
      color: #0f0;
      opacity: 0.7;
    }

    @keyframes fall {
      from {
        transform: translateY(-20px) rotate(0deg);
      }
      to {
        transform: translateY(300px) rotate(360deg);
      }
    }

    .hurt-flash {
      background-color: #400;
    }
  </style>
</head>
<body>

  <div id="inputs">
    <input id="fighter1Name" placeholder="Fighter 1">
    <input id="fighter2Name" placeholder="Fighter 2">
    <button onclick="startFight()">Start Fight</button>
  </div>

  <div id="ready"></div>
  <div id="fight-log"></div>
  <div id="winner"></div>

  <script>
    const brutalLines = [
      "{1} slams a rusted pipe into {2}'s jaw — teeth scatter like dice!",
      "{2} counters with a savage elbow that cracks {1}'s ribs!",
      "{1} grabs {2} and slams them into the concrete wall!",
      "{2} hurls a broken chain at {1}, wrapping it around their throat!",
      "{1} delivers a brutal kick that lifts {2} off the ground!",
      "{2}'s face smacks the floor — a pool of blood begins to form.",
      "{1} pounds down with fists, each hit echoing through the Gulag.",
      "{2} spits blood, then charges like a rabid beast!",
      "{1} bites {2}'s ear and doesn't let go!",
      "{2} gouges at {1}'s eyes in a frenzy!"
    ];

    let fightLines = [];
    let lineIndex = 0;
    let winner = '';

    function startFight() {
      const name1 = document.getElementById('fighter1Name').value || "Fighter 1";
      const name2 = document.getElementById('fighter2Name').value || "Fighter 2";

      const roles = ['', ''];
      const fighter1 = `${roles[Math.floor(Math.random() * 2)]} ${name1}`;
      const fighter2 = `${roles[Math.floor(Math.random() * 2)]} ${name2}`;

      document.getElementById('inputs').style.display = 'none';
      document.getElementById('fight-log').innerHTML = '';
      document.getElementById('winner').textContent = '';
      document.getElementById('ready').textContent = 'READY...';

      setTimeout(() => {
        document.getElementById('ready').textContent = '';
        runFight(fighter1, fighter2);
      }, 1500);
    }

    function runFight(f1, f2) {
      const used = new Set();
      const chosen = [];
      while (chosen.length < 5) {
        const i = Math.floor(Math.random() * brutalLines.length);
        if (!used.has(i)) {
          used.add(i);
          chosen.push(brutalLines[i].replace('{1}', f1).replace('{2}', f2));
        }
      }

      fightLines = chosen;
      lineIndex = 0;
      winner = Math.random() > 0.5 ? f1 : f2;
      showNextLine();
    }

    function showNextLine() {
      if (lineIndex < fightLines.length) {
        const log = document.getElementById('fight-log');
        const lines = log.querySelectorAll('.line');

        // Fade previous lines
        lines.forEach(line => {
          line.classList.remove('visible');
          line.classList.add('faded');
        });

        // Flash screen red
        flashHurt();

        // Add new line
        const line = document.createElement('div');
        line.className = 'line';
        line.textContent = fightLines[lineIndex];
        log.appendChild(line);

        // Trigger visibility
        setTimeout(() => line.classList.add('visible'), 10);

        lineIndex++;
        setTimeout(showNextLine, 4000);
      } else {
        setTimeout(showWinner, 6000);
      }
    }

    function showWinner() {
      const winnerDiv = document.getElementById('winner');
      winnerDiv.textContent = `🏆 ${winner} wins the Gulag.`;

      for (let i = 0; i < 50; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.textContent = ['*', '+', '.', '`', '^'][Math.floor(Math.random() * 5)];
        c.style.left = `${Math.random() * 100}%`;
        c.style.animationDuration = `${1.5 + Math.random()}s`;
        winnerDiv.appendChild(c);
      }
    }

    function flashHurt() {
      document.body.classList.add('hurt-flash');
      setTimeout(() => {
        document.body.classList.remove('hurt-flash');
      }, 100);
    }
  </script>

</body>
</html>
